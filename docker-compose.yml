version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: ChildParent.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build:
      context: ./WebAssembly
    ports:
      - "3000:80"
    depends_on:
      - api